<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Music Mogul</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600&display=swap" 
        rel="stylesheet" media="print" onload="this.media='all'">

  <!-- CSS -->
  <link rel="stylesheet" href="styles/setup.css">

  <!-- Meta -->
  <meta name="description" content="The Music Mogul — Fun, begiiner-friendly piano lessons for kids, teens, and homeschool families. Learn piano through colorful visuals, tips, and interactive tools.">
  <meta name="theme-color" content="#FF6EC7">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/icons/favicon-124.png">
</head>

<body>
  <!-- HEADER -->
  <header>
    <div class="logo-area">
      <img src="images/music-logo.png" alt="Music Mogul Logo" width="140" height="140" decoding="async">
      <h1><a href="index.html">The Music Mogul</a></h1>
    </div>
    <nav>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lessons.html">Beginner Lessons</a></li>
        <li><a href="setup.html">Student Setup</a></li>
      </ul>
    </nav>
  </header>

  <!-- MAIN CONTENT WRAPPER -->
  <main>

    <!-- HERO SECTION -->
    <section class="hero">
        <h2>Student Profile</h2>
    </section>

    <!-- FEATURES -->
    <section class="features">
      <h2>Student Info</h2>
      <div class="testbox">
        <form>
          <fieldset class="participants">
            <section class="participant1">
              <div class="item">
                <label for="fname">Name<span>*</span></label>
                <input id="fname" type="text" name="fname" value="" required />
              </div>
              <div class="item">
                <p>Skill Level</p>
                  <select>
                    <option selected value="" disabled selected></option>
                    <option value="1">Beginner</option>
                    <option value="2">Intermediate</option>
                    <option value="3">Advanced</option>
                  </select>
              </div>
              <div class="item">
                <label for="eaddress">Email Address<span>*</span></label>
                <input id="eaddress" type="text" name="eaddress" />
              </div>
            </section>
            <div class="btn-block">
             <button type="submit" id="submitButton">Submit</button>
            </div>
          </fieldset>
        </form>
      </div>
    </section>

  </main>
  <!-- END MAIN -->

  <!-- FOOTER -->
  <footer>
    <p>© 2025 The Music Mogul • Created by Heather Sego and Ashley Bradshaw</p>
  </footer>

  <!-- JS -->
  <script type="module" src="scripts/setup.js"></script>

</body>
</html>
