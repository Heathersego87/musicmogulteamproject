<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Music Mogul | Student Setup</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Poppins:wght@300;400;600&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  >

  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/setup.css">

  <meta
    name="description"
    content="The Music Mogul student setup page. Create a student profile and get started with beginner piano lessons."
  >
  <meta name="theme-color" content="#FF6EC7">

  <link rel="icon" type="image/png" href="images/icons/favicon-124.png">
</head>

<body>
  <header>
    <div class="logo-area">
      <img
        src="images/music-logo.png"
        alt="Music Mogul Logo"
        width="140"
        height="140"
        decoding="async"
      >
      <h1><a href="index.html">The Music Mogul</a></h1>
    </div>

    <button id="menuButton" class="menu-button" aria-label="Open navigation menu" aria-expanded="false" aria-controls="siteNav">
      ☰ Menu
    </button>

    <nav id="siteNav">
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="lessons.html">Beginner Lessons</a></li>
        <li><a href="setup.html" aria-current="page">Student Setup</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h2>Student Profile</h2>
    </section>

    <section class="features">
      <h2>Student Info</h2>

      <div class="testbox">
        <form id="studentForm" novalidate>
          <fieldset class="participants">
            <section class="participant1">
              <div class="item">
                <label for="fname">Name <span>*</span></label>
                <input id="fname" type="text" name="fname" required>
                <p class="error-message" id="fnameError"></p>
              </div>

              <div class="item">
                <label for="skillLevel">Skill Level <span>*</span></label>
                <select id="skillLevel" name="skillLevel" required>
                  <option value="">Select a level</option>
                  <option value="Beginner">Beginner</option>
                  <option value="Intermediate">Intermediate</option>
                  <option value="Advanced">Advanced</option>
                </select>
                <p class="error-message" id="skillLevelError"></p>
              </div>

              <div class="item">
                <label for="eaddress">Email Address <span>*</span></label>
                <input id="eaddress" type="email" name="eaddress" required>
                <p class="error-message" id="eaddressError"></p>
              </div>
            </section>

            <div class="btn-block">
              <button type="submit" id="submitButton">Submit</button>
            </div>

            <p id="formSuccess" class="success-message" aria-live="polite"></p>
          </fieldset>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>© 2026 The Music Mogul • Created by Heather Sego and Ashley Bradshaw</p>
  </footer>

  <script type="module" src="scripts/main.js"></script>
  <script type="module" src="scripts/setup.js"></script>
</body>
</html>
